<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>grand-octave: light demo</title>
  <script type="importmap">
  {
    "imports": {
      "@bootstrapp/light": "../../packages/light/view/index.js",
      "@bootstrapp/light/html": "../../packages/light/html/index.js",
      "@bootstrapp/light/signals": "../../packages/light/signals/index.ts",
      "@bootstrapp/light/types": "../../packages/light/types/index.js"
    }
  }
  </script>
  <style>
    :root {
      --ivory: #e8e1d1;
      --ivory-dim: #9b948a;
      --brass: #c9a35a;
      --brass-deep: #8a6d33;
      --font-display: Georgia, "Times New Roman", serif;
      --font-utility: ui-monospace, "SF Mono", Menlo, monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, #23222a, #121116 55%, #0a090c);
      font-family: var(--font-utility);
    }
    main { width: min(680px, 92vw); }
    h1 {
      margin: 0 0 0.4rem;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--ivory);
    }
    h1 small { color: var(--ivory-dim); font-size: 0.7em; }
    .compare { margin-top: 1rem; font-size: 0.75rem; }
    .compare a { color: var(--brass); }
    grand-octave {
      display: block;
      .bed {
        position: relative;
        height: 10rem;
        border-radius: 8px 8px 12px 12px;
        background: linear-gradient(180deg, #050506, #101014 12%);
        padding: 0.9rem 0.9rem 0;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 8%);
      }
      .naturals {
        position: relative;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        height: 100%;
      }
      button { appearance: none; border: 0; padding: 0; cursor: pointer; touch-action: none; }
      .natural {
        border-radius: 0 0 5px 5px;
        background: linear-gradient(180deg, #d9d2c2, var(--ivory) 8%, #cbc4b2 88%, #a49d8c);
        box-shadow: inset 0 -5px 8px rgb(0 0 0 / 18%);
      }
      .natural.down {
        background: linear-gradient(180deg, #b8b1a0, #cfc8b6 14%, #b3ac9a);
        box-shadow: inset 0 4px 9px rgb(0 0 0 / 32%);
      }
      .sharp {
        position: absolute;
        top: 0;
        width: 9%;
        height: 58%;
        margin-left: -4.5%;
        border-radius: 0 0 4px 4px;
        background: linear-gradient(180deg, #2b2b31, #0a0a0c 22%, #17171b 90%, #050506);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 22%), 0 6px 10px rgb(0 0 0 / 55%);
      }
      .sharp.down {
        background: linear-gradient(180deg, #1c1c21, #060607 30%);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%);
      }
      .down { outline: 1px solid var(--brass-deep); transform: translateY(1px); }
      .readout {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin: 0.9rem 0 0;
        font-family: var(--font-utility);
        font-size: 0.75rem;
        color: var(--ivory-dim);
      }
      .renders { color: var(--brass-deep); font-variant-numeric: tabular-nums; }
      .readout b {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 400;
        color: var(--brass);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>grand-octave <small>: render-once, thunk-driven, on light/html</small></h1>
    <grand-octave></grand-octave>
    <p class="compare">watch the render() counter stay at ×1 while you play, then <a href="./lit-octave.html">compare the lit original →</a></p>
  </main>
  <script type="module">
    import "./grand-octave.js";

  </script>
</body>
</html>
