<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>lc on light</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="importmap">
  {
    "imports": {
      "@bootstrapp/light": "../../view/index.js",
      "@bootstrapp/light/html": "../../html/index.js",
      "@bootstrapp/light/signals": "../../signals/index.ts",
      "@bootstrapp/light/types": "../../types/index.js",
      "@bootstrapp/light/env": "../../env/index.js",
      "@bootstrapp/light/navigation": "../../navigation/index.js",
      "@bootstrapp/light/theme": "../../theme/index.js",
      "@bootstrapp/light/": "../../"
    }
  }
  </script>
  <link rel="stylesheet" href="../../theme/theme.css" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <lc-flex direction="column" gap="lg" style="max-width: 36rem; margin: 0 auto">
    <lc-text tag="h1" size="2xl" weight="bold">A page on light and lc</lc-text>
    <lc-alert variant="info">Nothing here reaches a framework: light defines the components, the page imports their CSS.</lc-alert>
    <lc-card padding="lg">
      <lc-form id="signup" .fields=${[]}></lc-form>
      <lc-flex direction="column" gap="md">
        <lc-input id="name" label="Name" placeholder="Ada Lovelace" required></lc-input>
        <lc-input id="email" label="Email" type="email" placeholder="ada@example.com" required></lc-input>
        <lc-select id="plan" label="Plan" .options=${[]}></lc-select>
        <lc-textarea id="notes" label="Notes" rows="3"></lc-textarea>
        <lc-checkbox id="news" label="Send me the newsletter"></lc-checkbox>
        <lc-flex gap="sm" justify="end">
          <lc-button variant="secondary" id="open">Terms</lc-button>
          <lc-button variant="primary" icon="check" id="save">Save</lc-button>
        </lc-flex>
      </lc-flex>
    </lc-card>
    <lc-modal id="terms" title="Terms"><p>Short, since this is an example.</p></lc-modal>
    <lc-toast position="bottom-center"></lc-toast>
  </lc-flex>

  <script type="module">
    import View from "@bootstrapp/light";
    import { applyTheme } from "@bootstrapp/light/theme";
    import { loadPreset } from "@bootstrapp/light/theme/presets.js";
    import { configureIcons, iconify } from "@bootstrapp/light/theme/icons.js";
    import { toasts } from "@bootstrapp/light/components/feedback/toasts.js";

    applyTheme(await loadPreset("default"));
    configureIcons({ load: iconify("lucide") });

    const components = [
      "feedback/alert",
      "display/avatar",
      "display/badge",
      "display/button",
      "layout/card",
      "form/checkbox",
      "layout/container",
      "utility/darkmode",
      "overlay/dropdown",
      "layout/flex",
      "form/form",
      "display/icon",
      "form/input",
      "form/join",
      "form/label",
      "display/link",
      "navigation/menu",
      "overlay/modal",
      "navigation/nav-item",
      "navigation/navbar",
      "form/search",
      "form/select",
      "navigation/sidebar",
      "form/switch",
      "display/tag",
      "display/text",
      "form/textarea",
      "feedback/toast",
      "overlay/tooltip",
    ];
    for (const path of components) View.define((await import(`@bootstrapp/light/components/${path}.js`)).default);

    document.getElementById("plan").options = [{ label: "Free", value: "free" }, { label: "Pro", value: "pro" }];
    document.getElementById("open").addEventListener("click", () => document.getElementById("terms").open = true);
    document.getElementById("save").addEventListener("click", () => toasts.success("Saved"));
  </script>
</body>
</html>
